
name: stock-scanner

on:
  schedule:
    # 每天 UTC 10:30 = 北京 18:30（周末/节假日由代码内部判断跳过）
    - cron: "30 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCAN_SCOPE: all          # all=全市场  hot=只扫涨幅榜（省额度）
      WORKERS: "16"            # 并发线程数，太高容易被新浪限流
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q -r requirements.txt

      - name: Run scanner
        run: |
          # 先清掉旧结果：万一抓取失败，宁可报错，也不要把昨天的信号再推一遍
          rm -f result.json
          python scanner.py

      - name: Build report and push
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          REPORT_URL: https://huhao1009.github.io/stock-scanner/
        run: python report.py

      - name: Publish to docs
        run: |
          mkdir -p docs
          cp report.html docs/index.html
          if [ -f report.html ]; then echo "ok"; fi

      - name: Save pool and report
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pool.json result.json docs/index.html || true
          git commit -m "update $(date -u +%Y-%m-%d)" || echo "no change"
          git push || echo "skip push"

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
